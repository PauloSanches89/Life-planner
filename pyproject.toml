[project]
name = "life-planner"
version = "0.1.0"
description = "Local-first planner"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pywebview>=5",
    "cryptography>=44",
    "langgraph>=1.2",
    "langchain>=1.4",
    "langchain-ollama>=1.1",
    "langchain-openai>=1.7",
    "langchain-google-genai>=4.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pyinstaller>=6.16"]
cloud = ["azure-cosmos>=4.9"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["planner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
